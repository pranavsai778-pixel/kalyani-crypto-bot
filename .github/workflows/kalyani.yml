name: KALYANI Crypto Bot

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Get current date and hour
      id: datetime
      run: |
        HOUR=$(date -u +%H)
        DAY=$(date -u +%u)
        DATE=$(date -u +%d)
        echo "hour=$HOUR" >> $GITHUB_OUTPUT
        echo "day=$DAY" >> $GITHUB_OUTPUT
        echo "date=$DATE" >> $GITHUB_OUTPUT
    
    - name: Run KALYANI Hourly Bot
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani.py
    
    - name: Run KALYANI Daily Bot
      if: steps.datetime.outputs.hour == '18'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani_daily.py
    
    - name: Run KALYANI Weekly Bot
      if: steps.datetime.outputs.day == '1' && steps.datetime.outputs.hour == '18'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani_weekly.py
    
    - name: Run KALYANI Monthly Bot
      if: steps.datetime.outputs.date == '01' && steps.datetime.outputs.hour == '18'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani_monthly.py
