name: KALYANI Crypto Bot

on:
  schedule:
    # Hourly Report - Every hour
    - cron: '0 * * * *'
    # Daily Report - Every day at 11:30 PM IST (6:00 PM UTC)
    - cron: '0 18 * * *'
    # Weekly Report - Every Monday at 11:30 PM IST
    - cron: '0 18 * * 1'
    # Monthly Report - 1st of every month at 11:30 PM IST
    - cron: '0 18 1 * *'
  workflow_dispatch:

jobs:
  hourly_report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run KALYANI Hourly Bot
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani.py

  daily_report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Check if Daily Report Should Run
      id: check_daily
      run: |
        HOUR=$(date -u +%H)
        if [ "$HOUR" = "18" ]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Run KALYANI Daily Bot
      if: steps.check_daily.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani_daily.py

  weekly_report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Check if Weekly Report Should Run
      id: check_weekly
      run: |
        DAY=$(date -u +%u)
        HOUR=$(date -u +%H)
        if [ "$DAY" = "1" ] && [ "$HOUR" = "18" ]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Run KALYANI Weekly Bot
      if: steps.check_weekly.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani_weekly.py

  monthly_report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Check if Monthly Report Should Run
      id: check_monthly
      run: |
        DATE=$(date -u +%d)
        HOUR=$(date -u +%H)
        if [ "$DATE" = "01" ] && [ "$HOUR" = "18" ]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Run KALYANI Monthly Bot
      if: steps.check_monthly.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python kalyani_monthly.py
